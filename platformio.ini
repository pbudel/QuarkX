; Host-side unit tests for QuarkX. Not used when the library is consumed by
; Arduino IDE or PlatformIO projects.
;
;   pio test -e native

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Itest/support
    -DQUARKX_ENABLE_TLS=0
    -DQUARKX_LOG_LEVEL=0
    -DQUARKX_RECV_TIMEOUT_MS=200
    -DQUARKX_REQUEST_TIMEOUT_MS=600
    -DQUARKX_KEEPALIVE_MS=900
